<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nonsense Blocker</title>
  <style>
    body {
      margin: 0;
      padding: 3rem 1.5rem;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      background-attachment: fixed;
      color: white;
      box-sizing: border-box;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .header {
      text-align: center;
      margin-bottom: 3rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 3rem 2rem;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      display: inline-block;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .subtitle {
      margin: 0;
      color: #94a3b8;
      font-size: 1.2rem;
      line-height: 1.5;
    }
    .counter-badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 8px 20px;
      background: rgba(67, 206, 162, 0.2);
      border: 1px solid rgba(67, 206, 162, 0.5);
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #a7f3d0;
      transition: all 0.3s ease;
    }
    
    /* Interactive Grid */
    .quotes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    .quote-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 1.5rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }
    
    /* Hover State */
    .quote-card:hover {
      transform: translateY(-5px) scale(1.02);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    }
    
    /* Clicked/Collected State */
    .quote-card.collected {
      background: linear-gradient(135deg, #43cea2, #185a9d);
      border-color: transparent;
      transform: scale(0.98);
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.2);
    }
    .quote-card.collected .quote-text {
      color: #ffffff;
      font-weight: 500;
    }
    
    .quote-text {
      margin: 0;
      color: #e2e8f0;
      font-size: 1.1rem;
      line-height: 1.6;
      font-style: italic;
      transition: color 0.3s ease;
    }
    .emoji-span {
      font-size: 1.6rem;
      margin-right: 12px;
      vertical-align: middle;
      font-style: normal;
      display: inline-block;
    }

    /* Footer Button */
    .footer-action {
      text-align: center;
      margin-top: 3.5rem;
      margin-bottom: 2rem;
    }
    .proceed-btn {
      padding: 1.1rem 3rem;
      font-size: 1.15rem;
      font-weight: 600;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #64748b;
      cursor: not-allowed;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(8px);
    }
    .proceed-btn.unlocked {
      background: linear-gradient(135deg, #43cea2, #185a9d);
      color: #ffffff;
      border-color: transparent;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(67, 206, 162, 0.4);
    }
    .proceed-btn.unlocked:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 40px rgba(67, 206, 162, 0.6);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="icon">🤔</span>
      <h1>Will going to this site make you happy?</h1>
      <p class="subtitle">Nothing good will come out of doomscrolling here.</p>
      <div id="counter" class="counter-badge">Moments of Pause: 0 / 25</div>
    </div>
    
    <div id="quotes-grid" class="quotes-grid">
      <!-- JavaScript will inject the quotes here -->
    </div>

    <div class="footer-action">
      <button id="proceed-btn" class="proceed-btn" disabled>
        Click all 25 tiles to unlock (0/25)
      </button>
    </div>
  </div>

  <script src="quotes.js"></script>
</body>
</html>
